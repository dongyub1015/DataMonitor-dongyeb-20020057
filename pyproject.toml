[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamonitor"
version = "0.1.0"
description = "콘솔 기반 실시간 데이터 상태 조회 관리자 도구"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "textual>=0.50",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "psycopg2-binary>=2.9",
    "redis[hiredis]>=5.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
datamonitor = "datamonitor.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datamonitor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
